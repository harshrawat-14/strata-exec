name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run test suite
        run: cargo test --release

      - name: Build release binaries
        run: cargo build --release

      - name: Verify zero compiler warnings
        run: |
          warning_count=$(cargo build --release 2>&1 | grep -c "^warning" || true)
          echo "Warning count: $warning_count"
          test "$warning_count" -eq 0

      - name: Upload rl-env and research-sim binaries
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries
          path: |
            target/release/rl-env
            target/release/research-sim
          retention-days: 1

  python-smoke:
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rl/requirements.txt

      - name: Install RL dependencies (CPU-only torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.0
          pip install -r rl/requirements.txt

      - name: Smoke test — evaluate.py imports and action-space mapping
        working-directory: rl
        run: |
          python -c "
          from evaluate import (
              TWAPPolicy, HeuristicPolicy, ACOptimalPolicy, AdaptiveACPolicy,
              evaluate_all_strategies_on_date, V6_FRACTIONS, nearest_action,
              load_model,
          )
          assert len(V6_FRACTIONS) == 20
          assert nearest_action(0.02, V6_FRACTIONS) == 4
          assert nearest_action(0.03, V6_FRACTIONS) == 6
          assert nearest_action(0.05, V6_FRACTIONS) == 9
          print('Python smoke test: PASSED')
          "
