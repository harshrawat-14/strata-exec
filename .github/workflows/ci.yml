name: CI

on:
  push:
    branches: [main, web]
  pull_request:
    branches: [main, web]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run test suite
        run: cargo test --release

      - name: Build release binaries
        run: cargo build --release

      # Re-running a plain `cargo build` here would be a cached no-op that
      # prints no warnings, so the old grep-based check could never fail.
      # Deny warnings explicitly across every target, including tests.
      - name: Verify zero compiler warnings
        run: RUSTFLAGS="-D warnings" cargo build --release --all-targets

      - name: Verify formatting
        run: cargo fmt --check

      - name: Upload rl-env and research-sim binaries
        uses: actions/upload-artifact@v4
        with:
          name: rust-binaries
          path: |
            target/release/rl-env
            target/release/research-sim
          retention-days: 1

  python-smoke:
    runs-on: ubuntu-latest
    needs: rust-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rl/requirements.txt

      - name: Install RL dependencies (CPU-only torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.1.0
          pip install -r rl/requirements.txt pytest==8.4.2 pydantic==2.7.0  # pyproject filterwarnings imports pydantic

      - name: Download rl-env binary
        uses: actions/download-artifact@v4
        with:
          name: rust-binaries
          path: target/release

      - name: Make binaries executable
        run: chmod +x target/release/rl-env target/release/research-sim

      # environment.py queries ACTION_FRACTIONS from the binary at import time,
      # so the smoke test needs the binary built by rust-tests.
      - name: Smoke test — evaluate.py imports and action-space mapping
        working-directory: rl
        env:
          STRATAEXEC_RL_ENV_BIN: ${{ github.workspace }}/target/release/rl-env
        run: |
          python -c "
          from evaluate import (
              TWAPPolicy, HeuristicPolicy, ACOptimalPolicy, AdaptiveACPolicy,
              evaluate_all_strategies_on_date, nearest_action, load_model,
          )
          from environment import ACTION_FRACTIONS
          assert len(ACTION_FRACTIONS) == 20
          assert nearest_action(0.02, ACTION_FRACTIONS) == 7
          assert nearest_action(0.03, ACTION_FRACTIONS) == 8
          assert nearest_action(0.05, ACTION_FRACTIONS) == 9
          print('Python smoke test: PASSED')
          "

      # Data-free part of the Python suite. Tests that need TradeData/ or rl/models/ skip here
      # and must be run locally before pushing (golden fixtures, protocol, harness).
      - name: Python tests (data-free)
        env:
          STRATAEXEC_RL_ENV_BIN: ${{ github.workspace }}/target/release/rl-env
        run: python -m pytest rl/tests -q -rs
