[package]
name = "strata-exec"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "strata-exec"
path = "src/main.rs"

[[bin]]
name = "research-sim"
path = "src/bin/research_sim.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
ethers = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"
axum = "0.7"
tower = "0.4"
async-trait = "0.1"
rand = { version = "0.8", features = ["std_rng"] }
rand_distr = "0.4"
crossbeam-channel = "0.5"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

