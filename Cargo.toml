[package]
name = "strata-exec"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "strata-exec"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
ethers = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

