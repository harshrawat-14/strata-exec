services:
  - type: web
    name: strataexec-api
    env: python
    buildCommand: pip install -r web/requirements.txt
    startCommand: uvicorn web.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./strataexec.db
      - key: REDIS_URL
        fromService:
          type: redis
          name: strataexec-redis
          property: connectionString

  - type: worker
    name: strataexec-worker
    env: python
    buildCommand: pip install -r web/requirements.txt
    startCommand: python -m arq web.arq_worker.WorkerSettings
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./strataexec.db
      - key: REDIS_URL
        fromService:
          type: redis
          name: strataexec-redis
          property: connectionString

  - type: redis
    name: strataexec-redis
    plan: free
    ipAllowList: []
